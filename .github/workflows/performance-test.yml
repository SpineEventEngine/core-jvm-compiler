name: Test build performance

on: pull_request

jobs:
  build:
    name: Test build performance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v6

      # This step is a copy of the one in build-on-ubuntu.yml, which comes
      # from `config`. This workflow belongs to this repository, so the copy
      # is kept in sync by hand.
      #
      # Mirrors the pagefile step in build-on-windows.yml. Without enough swap,
      # a memory peak becomes an instant OOM kill; this gives the kernel
      # somewhere to fall back to.
      #
      # Hosted runners differ in the swap they come with: those on Azure have
      # a 3 GiB `/swapfile`, those on AWS a zram device (`ubuntu-24.04`) or no
      # swap at all (`ubuntu-26.04`). So the step does not resize whatever swap
      # it finds. It deletes the swap files, so that their disk space goes to
      # the new one, leaves swap devices as they are, and adds its own file.
      #
      # More swap is a safety net, not a precondition of the build, so a
      # failure here does not stop the job. Its error still shows in the run
      # summary.
      - name: Add swap space
        continue-on-error: true
        shell: bash
        env:
          SWAP_FILE: /swapfile
          SWAP_SIZE: 8G
        run: |
          swapon --show
          df -h /
          swapon --noheadings --raw --show=NAME,TYPE | while read -r name type; do
            if [ "$type" = file ]; then
              sudo swapoff "$name"
              sudo rm -f "$name"
            fi
          done
          sudo rm -f "$SWAP_FILE"
          sudo fallocate -l "$SWAP_SIZE" "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          free -h
          swapon --show

      - name: Measure build performance
        shell: bash
        run: ./gradlew checkPerformance --stacktrace
