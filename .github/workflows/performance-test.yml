name: Test build performance

on: pull_request

jobs:
  build:
    name: Test build performance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v6

      # Mirrors the pagefile step in build-on-windows.yml. The Linux runner
      # ships with effectively no swap, so a memory peak becomes an instant
      # OOM kill; this gives the kernel somewhere to fall back to.
      - name: Add swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 8

      - name: Measure build performance
        shell: bash
        run: ./gradlew checkPerformance --stacktrace
