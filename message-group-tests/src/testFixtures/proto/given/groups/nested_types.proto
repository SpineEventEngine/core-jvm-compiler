syntax = "proto3";

package given.groups;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.tools.core.mgroup.given";
option java_outer_classname = "NestedTypesProto";
option java_multiple_files = true;

// Types for testing field classes of message types that are nested in other message types.
//
// Please see `io.spine.tools.core.jvm.mgroup.NestedTypeFieldSpec` test suite for details.

// An enrollment of a student in a course.
message Enrollment {

    // The course the student is enrolled in.
    Course course = 1;
}

// A course at an educational establishment.
message Course {

    string title = 1;

    // When the course takes place.
    Schedule schedule = 2;

    // The schedule of the course.
    message Schedule {
        string weekday = 1;
    }
}
