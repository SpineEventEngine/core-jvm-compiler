syntax = "proto3";

package given.naming.outer;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.given.naming.outer";
// The name of the class generated for the `Crate` type below.
option java_outer_classname = "CrateField";
option java_multiple_files = false;

// A message nested in the outer class that is named like the class generated for
// the type of the field of the message.
message Cargo {
    Crate crate = 1;
}

message Crate {
    string id = 1;
}
