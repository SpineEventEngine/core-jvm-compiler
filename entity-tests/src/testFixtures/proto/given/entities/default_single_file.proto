syntax = "proto3";

package given.entities;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.tools.core.jvm.entity.given";
option java_outer_classname = "DefaultSingleFileProto";

// An entity state in a file which does not have the `java_multiple_files` option.
//
// The option is `false` by default, so such a state must be rejected at compile time.
// The type is excluded from regular pipeline runs (see
// `EntityPluginTestSetup.defaultExclusions`) and exercised by
// `DefaultSingleFileEntityStateErrorSpec`.
//
message Garage {
    option (entity).kind = PROJECTION;
    string id = 1;
    string name = 2 [(column) = true];
}
