syntax = "proto3";

package given.entities;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.tools.core.jvm.entity.given";
option java_outer_classname = "SingleFileProto";
option java_multiple_files = false;

// An entity state with the Java class nested in the outer class of the file.
//
// Such a state must be rejected at compile time. The type is excluded from regular
// pipeline runs (see `EntityPluginTestSetup.defaultExclusions`) and exercised by
// `SingleFileEntityStateErrorSpec`.
//
message Depot {
    option (entity).kind = PROJECTION;
    string id = 1;
    string name = 2 [(column) = true];
}
