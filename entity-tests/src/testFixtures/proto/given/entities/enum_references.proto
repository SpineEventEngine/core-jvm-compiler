syntax = "proto3";

package given.entities.references.enums;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.tools.core.jvm.entity.given.references.enums";
option java_outer_classname = "EnumReferencesProto";
option java_multiple_files = true;

// An entity state with the columns of the enum types, the names of which are the same as the names
// of the classes nested in the Java class of the state.
//
// Please see `TypeReferencesSpec` for the test.

// The enums with the names of the classes generated for an entity state.

enum Column {
    COLUMN_UNDEFINED = 0;
    WIDE = 1;
}

enum Query {
    QUERY_UNDEFINED = 0;
    DAILY = 1;
}

enum QueryBuilder {
    QUERY_BUILDER_UNDEFINED = 0;
    VISUAL = 1;
}

enum Field {
    FIELD_UNDEFINED = 0;
    GREEN = 1;
}

// An enum with the name which no nested class has.
enum Color {
    COLOR_UNDEFINED = 0;
    RED = 1;
}

// An entity state with the columns of the types from this file.
message Plot {
    option (entity).kind = PROJECTION;

    string id = 1;
    Column first = 2 [(column) = true];
    Query second = 3 [(column) = true];
    QueryBuilder third = 4 [(column) = true];
    Field fourth = 5 [(column) = true];
    Color fifth = 6 [(column) = true];
}
