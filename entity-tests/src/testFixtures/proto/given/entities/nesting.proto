syntax = "proto3";

package given.entities;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.tools.core.jvm.entity.given";
option java_outer_classname = "NestingProto";
option java_multiple_files = true;

// A message with entity states nested in it.
//
// An entity state must be a top-level message, so such states must be rejected at
// compile time. The type is excluded from regular pipeline runs (see
// `EntityPluginTestSetup.defaultExclusions`) and exercised by `NestedEntityStateErrorSpec`.
//
message Office {

    message Room {
        option (entity).kind = PROJECTION;
        string id = 1;
        string name = 2 [(column) = true];
    }

    message Desk {
        option (entity).kind = AGGREGATE;
        string id = 1;
    }
}

// A message with an entity state nested two levels deep.
//
// The type is excluded from regular pipeline runs (see
// `EntityPluginTestSetup.defaultExclusions`) and exercised by `DeeplyNestedEntityStateErrorSpec`.
//
message Campus {

    message Building {

        message Floor {
            option (entity).kind = PROJECTION;
            string id = 1;
        }
    }
}

// A top-level entity state with nested types which are not entity states.
message Warehouse {
    option (entity).kind = AGGREGATE;

    message Shelf {
        string label = 1;
        int32 capacity = 2;
    }

    enum Status {
        S_UNKNOWN = 0;
        OPEN = 1;
        CLOSED = 2;
    }

    string id = 1;
    Status status = 2 [(column) = true];
    Shelf front_shelf = 3 [(column) = true];
    repeated Shelf shelf = 4;
}
