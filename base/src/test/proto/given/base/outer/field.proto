syntax = "proto3";

package given.base.reserved.derived;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
// The outer class has the reserved name because of the name of this file.
option java_package = "io.spine.tools.core.jvm.given.base.reserved.derived";

// A message for which the Java class is nested in the outer class of the file.
//
// Please see `ReservedNameSpec` for the test.
//
message Meadow {
    string grass = 1;
}
