syntax = "proto3";

package spine.tools.references;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.tools.references";
option java_outer_classname = "ReferencesProto";
option java_multiple_files = true;

// Entity states with the columns and IDs of the types, the names of which are the same as the names
// of the classes nested in the Java classes of the states.
//
// Please see the `TypeReferencesIgTest` test suite for details.
//

// The types with the names of the classes generated for an entity state.

message Column {
    string title = 1;
}

enum Query {
    QUERY_UNDEFINED = 0;
    DAILY = 1;
}

message QueryBuilder {
    string title = 1;
}

message Field {
    string title = 1;
}

// A message with the name of a message nested in the entity state which uses this type.
message Status {
    string title = 1;
}

// An entity state with the columns of the types from this file.
message Plot {
    option (entity).kind = PROJECTION;

    string id = 1;
    Column column = 2 [(column) = true];
    Query frequency = 3 [(column) = true];
    QueryBuilder builder = 4 [(column) = true];
    Field field = 5 [(column) = true];
    .spine.tools.references.Status status = 6 [(column) = true];

    // The type of this column is the message nested in this one.
    Status own_status = 7 [(column) = true];

    message Status {
        string text = 1;
    }
}

// Entity states with the IDs of the types from this file.

message ColumnHolder {
    option (entity).kind = ENTITY;

    Column id = 1;
    string name = 2 [(column) = true];
}

message QueryBuilderHolder {
    option (entity).kind = ENTITY;

    QueryBuilder id = 1;
    string name = 2 [(column) = true];
}

message FieldHolder {
    option (entity).kind = ENTITY;

    Field id = 1;
    string name = 2 [(column) = true];
}
